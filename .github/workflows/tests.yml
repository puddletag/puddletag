name: Tests

# Pushes to master and to maintenance branches (3.0.x), and tags, run these
# tests through publish-to-pypi.yml, which only publishes once they pass.
on:
  pull_request:
  workflow_call:

jobs:
  tests:
    name: Run the test suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # id-token lets the Codecov upload log in with GitHub OIDC. GitHub
    # doesn't grant it to PRs from forks; those upload without a token.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python, from the oldest (python_requires in setup.py)
        # to the newest.
        python-version: ['3.14', '3.15']
        # Only this Python measures coverage and uploads it to Codecov; the
        # others skip it and run faster. Name one of the versions above:
        # another one would add a job instead of marking an existing one.
        include:
        - python-version: '3.15'
          coverage: true

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    # ffmpeg, and mpcenc (musepack-tools) for .mpc, generate the synthetic
    # audio fixtures; fpcalc (libchromaprint-tools) fingerprints a file for
    # the AcoustID tests; the libraries are what the PyQt6 wheel's Qt
    # (offscreen platform) links against.
    - name: Install the audio encoders, fpcalc and the libraries Qt needs
      run: >-
        sudo apt-get update &&
        sudo apt-get install --yes --no-install-recommends
        ffmpeg libchromaprint-tools musepack-tools
        libdbus-1-3 libegl1 libfontconfig1 libfreetype6 libgl1
        libglib2.0-0t64 libx11-6 libxkbcommon0

    - name: Install Python dependencies
      run: python -m pip install -r requirements.txt -r requirements-dev.txt

    # One pytest-xdist worker per core: GitHub's standard Linux runner for
    # public repositories has 4.
    - name: Run tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: >-
        python -m pytest --numprocesses=4
        ${{ matrix.coverage && '--cov --cov-report=term --cov-report=xml' || '' }}

    # A Codecov outage must not fail the tests: "All tests passed" is
    # required to merge.
    - name: Upload coverage to Codecov
      if: matrix.coverage
      uses: codecov/codecov-action@v7
      with:
        files: coverage.xml
        use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        fail_ci_if_error: false

  # codespell with pyproject.toml's settings, as tests/unit/test_spelling.py
  # runs it, at the dev lock's pin. The lock can't serve as a constraints
  # file (pip refuses its coverage[toml] extra), so the pin is read from it.
  spelling:
    name: Check the spelling
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.15
      uses: actions/setup-python@v7
      with:
        python-version: '3.15'
    - name: Install codespell
      run: python -m pip install "$(grep '^codespell==' requirements-dev.txt)"
    - name: Check the spelling
      run: codespell

  # Builds the docs (docs/) with every Sphinx warning an error, at the docs
  # lock's pins, into the site docs.puddletag.net serves. On a push to master
  # it uploads the site, and publish-to-pypi.yml deploys it to GitHub Pages
  # once every test has passed.
  docs:
    name: Build the docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.15
      uses: actions/setup-python@v7
      with:
        python-version: '3.15'
    - name: Install Sphinx and the theme
      run: python -m pip install -r requirements-docs.txt
    - name: Build the docs
      run: sphinx-build -W --keep-going -b html -E -q docs "$RUNNER_TEMP/docs"
    # As make html does: drops the title heading from the home, screenshots
    # and about pages, which the navigation bar already names.
    - name: Remove the duplicate page titles
      run: python docs/fix_html.py "$RUNNER_TEMP/docs"
    # Called from publish-to-pypi.yml, github.ref is the caller's: master's
    # pushes upload; pull requests, tags and maintenance branches don't.
    # Hidden files (Sphinx's .doctrees and .buildinfo) stay out of the site.
    - name: Upload the site for GitHub Pages
      if: github.ref == 'refs/heads/master'
      uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ runner.temp }}/docs

  # master's branch protection requires this job, not the matrix jobs or the
  # docs and spelling jobs, so they can change without touching the
  # protection; keep its name. always() makes it run, and fail, when a job it
  # needs fails: a skipped required check would count as passed.
  all-tests:
    name: All tests passed
    if: always()
    needs: [docs, spelling, tests]
    runs-on: ubuntu-latest
    steps:
    - run: test "${{ needs.docs.result }}" = success && test "${{ needs.spelling.result }}" = success && test "${{ needs.tests.result }}" = success
