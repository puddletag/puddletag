name: Tests

# Pushes to master and tags run these tests through publish-to-pypi.yml,
# which only publishes once they pass.
on:
  pull_request:
  workflow_call:

jobs:
  tests:
    name: Run the test suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # id-token lets the Codecov upload log in with GitHub OIDC. GitHub
    # doesn't grant it to PRs from forks; those upload without a token.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Python (python_requires in setup.py) and the newest.
        python-version: ['3.13', '3.14']

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    # ffmpeg generates the synthetic audio fixtures; the libraries are what
    # the PyQt6 wheel's Qt (offscreen platform) links against.
    - name: Install ffmpeg and the libraries Qt needs
      run: >-
        sudo apt-get update &&
        sudo apt-get install --yes --no-install-recommends
        ffmpeg
        libdbus-1-3 libegl1 libfontconfig1 libfreetype6 libgl1
        libglib2.0-0t64 libx11-6 libxkbcommon0

    - name: Install Python dependencies
      run: python -m pip install -r requirements.txt -r requirements-dev.txt

    - name: Run tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: python -m pytest --cov --cov-report=term --cov-report=xml

    # A Codecov outage must not fail the tests: "All tests passed" is
    # required to merge.
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: coverage.xml
        use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        fail_ci_if_error: false

  # master's branch protection requires this job, not the matrix jobs, so the
  # Python versions above can change without touching the protection; keep
  # its name. always() makes it run, and fail, when a matrix job fails: a
  # skipped required check would count as passed.
  all-tests:
    name: All tests passed
    if: always()
    needs: tests
    runs-on: ubuntu-latest
    steps:
    - run: test "${{ needs.tests.result }}" = success
