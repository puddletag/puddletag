name: Publish Python 🐍 distributions 📦 to PyPI and TestPyPI

on:
  push:
    branches:
      - 'master'
    tags:
      - '*'

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    # The Codecov upload in tests.yml logs in with GitHub OIDC.
    permissions:
      contents: read
      id-token: write

  build-n-publish:
    needs: tests
    name: Build and publish Python 🐍 distributions 📦 to PyPI and TestPyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # This is required for trusted publishing

    steps:
    - uses: actions/checkout@master
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Bump buildid (for Test PyPI only)
      if: ( ! startsWith(github.ref, 'refs/tags') )
      run: |
        sed -i "/_buildid/s/None/$GITHUB_RUN_NUMBER/" puddlestuff/__init__.py

    - name: Install pypa/build
      run: >-
        python -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: >-
        python -m
        build
        --sdist
        --wheel
        --outdir dist/
        .

    - name: Publish distribution 📦 to Test PyPI
      if: ( ! startsWith(github.ref, 'refs/tags') )
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
    - name: Publish distribution 📦 to PyPI
      if: startsWith(github.ref, 'refs/tags')
      uses: pypa/gh-action-pypi-publish@release/v1

  # Deploys the site that tests.yml's docs job built to GitHub Pages
  # (docs.puddletag.net), on pushes to master only. The repository's Pages
  # settings take their source from GitHub Actions and hold the custom domain.
  deploy-docs:
    needs: tests
    if: github.ref == 'refs/heads/master'
    name: Publish the docs to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time: a run waiting here gives way to a newer one,
    # and a deployment under way finishes.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
